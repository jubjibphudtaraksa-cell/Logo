name: Build VortexLogo
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o VortexLogo-source.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: VortexLogo/pom.xml
      - run: mvn --batch-mode clean package
        working-directory: VortexLogo
      - uses: actions/upload-artifact@v4
        with:
          name: VortexLogo
          path: VortexLogo/target/VortexLogo-1.0.0.jar
